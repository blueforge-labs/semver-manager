product_data:
  name: smgr

tasks:
- name: build-cli 
  type: build
  build:
    environment: docker:go:1.27.4
    command: go build -o build-artefacts/smgr ./src/cmd/smgr

- name: alpha-releases
  type: release
  needs: [build-cli, tests]
  triggers: [pull_request]
  release:
    stream: '*.*.*-alpha.*'
    type: pre-release

- name: release
  type: release
  needs: [build-cli, tests]
  triggers: [push:main]
  release:
    stream: '*.*.*'
    type: release

- name: tests
  type: test
  test:
    environment: docker:go:1.27.4:test
    command: go test ./src/...
